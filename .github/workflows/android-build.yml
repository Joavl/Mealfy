name: Android Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          # Sem isto o build cai no default `http://localhost:3000` — que, num
          # celular, é o próprio aparelho. Toda chamada de API falharia.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://mealfy-backend.onrender.com' }}
          # Desliga o fallback local: sem isto o APK mascara falha de API com
          # dados fictícios e parece funcionar exibindo famílias que não existem.
          VITE_DISABLE_LOCAL_FALLBACK: 'true'
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mealfy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
