name: iOS Build (unsigned)

# Builds the iOS app on a cloud macOS runner to PROVE it compiles.
# This produces an UNSIGNED simulator build — it is NOT installable on a
# physical iPhone (Apple requires code signing for that; see codemagic.yaml
# for the signed/.ipa path).
#
# Requires repo secrets (same ones used by android-build.yml):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Plugins (ex.: @capacitor/geolocation) trazem frameworks compilados com
      # Swift novo; precisamos do Xcode mais recente da imagem.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Use CocoaPods (mature path); the SPM plugin packaging has compile bugs.
      - name: Add iOS platform (CocoaPods)
        run: npx cap add ios --packagemanager CocoaPods

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Compile (unsigned, simulator)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
