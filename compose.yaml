services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mealfy_e2e
      POSTGRES_USER: mealfy_e2e
      POSTGRES_PASSWORD: mealfy_e2e
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealfy_e2e -d mealfy_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
