name: mealfy-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: mealfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mealfy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - mealfy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mealfy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mealfy-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealfy-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-staging}
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mealfy}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mealfy}?schema=public
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      - STEP_UP_OTP_HMAC_KEY=${STEP_UP_OTP_HMAC_KEY:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - PIX_EXPIRATION_MINUTES=${PIX_EXPIRATION_MINUTES:-30}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - GIFT_CARD_PROVIDER=${GIFT_CARD_PROVIDER:-manual_inventory}
      - GIFT_CARD_ORDER_STALE_MINUTES=${GIFT_CARD_ORDER_STALE_MINUTES:-15}
      - EMAIL_DELIVERY_MODE=${EMAIL_DELIVERY_MODE:-capture}
      - EMAIL_CAPTURE_DIR=${EMAIL_CAPTURE_DIR:-.tmp/mail-capture}
      - EMAIL_ALLOWLIST=${EMAIL_ALLOWLIST:-}
      - DIRECT_PIX_MODE=${DIRECT_PIX_MODE:-synthetic}
      - DIRECT_PIX_SYNTHETIC_EVPS=${DIRECT_PIX_SYNTHETIC_EVPS:-00000000-0000-0000-0000-000000000001}
      - DIRECT_PIX_CONTROLLER_APPROVED=${DIRECT_PIX_CONTROLLER_APPROVED:-false}
      - DIRECT_PIX_LEGAL_BASIS_APPROVED=${DIRECT_PIX_LEGAL_BASIS_APPROVED:-false}
      - DIRECT_PIX_TERMS_APPROVED=${DIRECT_PIX_TERMS_APPROVED:-false}
      - DIRECT_PIX_RETENTION_APPROVED=${DIRECT_PIX_RETENTION_APPROVED:-false}
      - DIRECT_PIX_OPERATIONS_APPROVED=${DIRECT_PIX_OPERATIONS_APPROVED:-false}
      - DIRECT_PIX_CONTROLLER_APPROVAL_REF=${DIRECT_PIX_CONTROLLER_APPROVAL_REF:-}
      - DIRECT_PIX_LEGAL_BASIS_APPROVAL_REF=${DIRECT_PIX_LEGAL_BASIS_APPROVAL_REF:-}
      - DIRECT_PIX_TERMS_VERSION=${DIRECT_PIX_TERMS_VERSION:-}
      - DIRECT_PIX_RETENTION_POLICY_VERSION=${DIRECT_PIX_RETENTION_POLICY_VERSION:-}
      - DIRECT_PIX_OPERATIONS_RUNBOOK_REF=${DIRECT_PIX_OPERATIONS_RUNBOOK_REF:-}
      - APP_URL=${APP_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
    expose:
      - "3000"
    networks:
      - mealfy-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_DISABLE_LOCAL_FALLBACK=true
    container_name: mealfy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - mealfy-net

  caddy:
    image: caddy:2-alpine
    container_name: mealfy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}
      - API_DOMAIN=${API_DOMAIN:?Defina API_DOMAIN no arquivo .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - mealfy-net

volumes:
  mealfy_postgres_data:
  caddy_data:
  caddy_config:

networks:
  mealfy-net:
    driver: bridge
