name: mealfy-prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealfy-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-staging}
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DATABASE_URL=${DATABASE_URL:?Defina DATABASE_URL no arquivo .env}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      - STEP_UP_OTP_HMAC_KEY=${STEP_UP_OTP_HMAC_KEY:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - PIX_EXPIRATION_MINUTES=${PIX_EXPIRATION_MINUTES:-30}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - GIFT_CARD_PROVIDER=${GIFT_CARD_PROVIDER:-manual_inventory}
      - GIFT_CARD_ORDER_STALE_MINUTES=${GIFT_CARD_ORDER_STALE_MINUTES:-15}
      - EMAIL_DELIVERY_MODE=${EMAIL_DELIVERY_MODE:-capture}
      - EMAIL_CAPTURE_DIR=${EMAIL_CAPTURE_DIR:-.tmp/mail-capture}
      - EMAIL_ALLOWLIST=${EMAIL_ALLOWLIST:-}
      - DIRECT_PIX_MODE=${DIRECT_PIX_MODE:-synthetic}
      - DIRECT_PIX_SYNTHETIC_EVPS=${DIRECT_PIX_SYNTHETIC_EVPS:-00000000-0000-0000-0000-000000000001}
      - APP_URL=${APP_URL:-https://app.mealfy.org}
    expose:
      - "3000"
    networks:
      - mealfy-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.mealfy.org}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
        - VITE_DISABLE_LOCAL_FALLBACK=true
    container_name: mealfy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - mealfy-net

  caddy:
    image: caddy:2-alpine
    container_name: mealfy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-app.mealfy.org}
      - API_DOMAIN=${API_DOMAIN:-api.mealfy.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - mealfy-net

volumes:
  caddy_data:
  caddy_config:

networks:
  mealfy-net:
    driver: bridge
